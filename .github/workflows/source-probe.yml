name: Source probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Read-only source probe
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF text extractor
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
          pdftotext -v

      - name: Verify read-only starting state
        run: test -z "$(git status --porcelain)"

      - name: Probe public valuation sources
        shell: bash
        run: |
          set -Eeuo pipefail
          work_dir="$RUNNER_TEMP/source-probe"
          mkdir -p "$work_dir"
          results="$work_dir/results.tsv"
          : > "$results"

          fetch() {
            local url="$1" output="$2" status
            status="$(curl --silent --show-error --location \
              --retry 1 --retry-all-errors --connect-timeout 15 --max-time 45 \
              --user-agent 'peibi-market-data-source-probe/2.0' \
              --output "$output" --write-out '%{http_code}' "$url" || true)"
            printf '%s' "$status"
          }

          emit_html_pe() {
            python3 - "$1" "$2" "$3" "$4" <<'PY'
          import re, sys
          from html import unescape
          from html.parser import HTMLParser
          path, source, metric, http = sys.argv[1:]
          class Extractor(HTMLParser):
              def __init__(self): super().__init__(); self.parts=[]
              def handle_data(self, data): self.parts.append(data)
          try:
              p=Extractor(); p.feed(open(path, encoding='utf-8', errors='ignore').read())
              text=re.sub(r'\s+', ' ', unescape(' '.join(p.parts)))
              section=text[text.find('Index Characteristics as of'):]
              date=re.search(r'Index Characteristics as of\s+([A-Z][a-z]{2}\s+\d{1,2}\s+\d{4})', section)
              value=re.search(r'Price/Earnings\b.{0,900}?\b(\d+\.\d+)\b', section)
              if http == '200' and date and value:
                  print(f'{source}\t{metric}\t{http}\tN/A\t{value.group(1)}x\t{date.group(1)}\tPASS')
              else:
                  print(f'{source}\t{metric}\t{http or "000"}\tN/A\t—\t—\tPARSE_FAIL')
          except Exception:
              print(f'{source}\t{metric}\t{http or "000"}\tN/A\t—\t—\tPARSE_FAIL')
          PY
          }

          parse_csi() {
            local source="$1" file="$2" http="$3" metric_spec="$4"
            local text_file="${file}.txt"
            if [ "$http" = "200" ] && pdftotext -layout "$file" "$text_file"; then
              python3 - "$source" "$http" "$metric_spec" "$text_file" >> "$results" <<'PY'
          import re, sys
          source, http, metric_spec, path = sys.argv[1:]
          text = open(path, encoding="utf-8", errors="ignore").read()
          # CSI factsheets print the observation date in the document header.
          header = text[:800]
          date_match = re.search(r"(20\d{2})年\s*(\d{1,2})月\s*(\d{1,2})日", header)
          date = None if not date_match else "{}-{:02d}-{:02d}".format(*map(int, date_match.groups()))
          for item in metric_spec.split("|"):
              metric, label, unit = item.split("~")
              match = re.search(re.escape(label) + r"\s+([0-9]*\.?[0-9]+|--|—)", text)
              if not match:
                  result, value = "PARSE_FAIL", "—"
              elif match.group(1) in ("--", "—"):
                  result, value = "DATA_NOT_AVAILABLE", "null"
              elif not date:
                  result, value = "PARSE_FAIL", match.group(1) + unit
              else:
                  result, value = "PASS", match.group(1) + unit
              print(f"{source}\t{metric}\t{http}\tPASS\t{value}\t{date or '—'}\t{result}")
          PY
            else
              IFS='|' read -ra entries <<< "$metric_spec"
              for entry in "${entries[@]}"; do
                IFS='~' read -r metric _ _ <<< "$entry"
                printf '%s\t%s\t%s\tFAIL\t—\t—\tPARSE_FAIL\n' "$source" "$metric" "$http" >> "$results"
              done
            fi
          }

          parse_hstech() {
            local source="$1" file="$2" http="$3"
            local text_file="${file}.txt"
            if [ "$http" = "200" ] && pdftotext -layout "$file" "$text_file"; then
              python3 - "$source" "$http" "$text_file" >> "$results" <<'PY'
          import re, sys
          source, http, path = sys.argv[1:]
          text = open(path, encoding="utf-8", errors="ignore").read()
          # Do not infer a date from the workflow, download, launch or base date.
          date_match = re.search(r"(?:All data|Data|Index information)\s+(?:as at|as of)\s+(\d{1,2}\s+[A-Z][a-z]{2}\s+20\d{2})", text, re.I)
          row = re.search(r"\bHSTECH\s+([0-9.]+)\s+([0-9.]+)", text)
          if not row:
              result, value = "PARSE_FAIL", "—"
          elif not date_match:
              result, value = "PARSE_FAIL", row.group(2) + "x"
          elif row.group(2) in ("--", "—"):
              result, value = "DATA_NOT_AVAILABLE", "null"
          else:
              result, value = "PASS", row.group(2) + "x"
          print(f"{source}\tPE\t{http}\tPASS\t{value}\t{date_match.group(1) if date_match else '—'}\t{result}")
          PY
            else
              printf '%s\tPE\t%s\tFAIL\t—\t—\tPARSE_FAIL\n' "$source" "$http" >> "$results"
            fi
          }

          qndx="$work_dir/qndx.html"; status="$(fetch 'https://www.ssga.com/us/en/individual/etfs/state-street-spdr-portfolio-nasdaq-100-etf-qndx' "$qndx")"; emit_html_pe "$qndx" 'State Street QNDX' 'PE' "$status" >> "$results"
          spy="$work_dir/spy.html"; status="$(fetch 'https://www.ssga.com/us/en/individual/etfs/state-street-spdr-sp-500-etf-trust-spy' "$spy")"; emit_html_pe "$spy" 'State Street SPY' 'PE' "$status" >> "$results"

          a500="$work_dir/a500.pdf"; status="$(fetch 'https://oss-ch.csindex.com.cn/static/html/csindex/public/uploads/indices/detail/files/zh_CN/000510factsheet.pdf' "$a500")"; parse_csi 'CSI A500 factsheet' "$a500" "$status" 'PE~滚动市盈率~x|PB~市净率~x'
          dividend="$work_dir/dividend.pdf"; status="$(fetch 'https://oss-ch.csindex.com.cn/static/html/csindex/public/uploads/indices/detail/files/zh_CN/930955factsheet.pdf' "$dividend")"; parse_csi 'CSI 红利低波100 factsheet' "$dividend" "$status" 'PE~滚动市盈率~x|Dividend Yield~股息率~%'
          securities="$work_dir/securities.pdf"; status="$(fetch 'https://oss-ch.csindex.com.cn/static/html/csindex/public/uploads/indices/detail/files/zh_CN/399975factsheet.pdf' "$securities")"; parse_csi 'CSI 证券 factsheet' "$securities" "$status" 'PE~滚动市盈率~x|PB~市净率~x'
          hstech="$work_dir/hstech.pdf"; status="$(fetch 'https://www.hsi.com.hk/static/uploads/contents/en/dl_centre/factsheets/hsteche.pdf' "$hstech")"; parse_hstech 'Hang Seng TECH factsheet' "$hstech" "$status"

          {
            echo '## Source probe V2'
            echo
            echo '| Source | Metric | HTTP | PDF text extraction | Value | Observation Date | Result |'
            echo '|---|---|---:|---|---:|---|---|'
            while IFS=$'\t' read -r source metric http extraction value date result; do
              echo "| ${source} | ${metric} | ${http} | ${extraction} | ${value} | ${date} | ${result} |"
            done < "$results"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          cat "$results"

      - name: Verify read-only ending state
        if: always()
        run: test -z "$(git status --porcelain)"
