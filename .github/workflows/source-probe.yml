name: Source probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Read-only source probe
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF text extractor
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
          pdftotext -v

      - name: Verify read-only starting state
        run: test -z "$(git status --porcelain)"

      - name: Probe public valuation sources
        shell: bash
        run: |
          set -Eeuo pipefail
          work_dir="$RUNNER_TEMP/source-probe"
          mkdir -p "$work_dir"
          results="$work_dir/results.tsv"
          : > "$results"

          fetch() {
            local url="$1" output="$2" status
            status="$(curl --silent --show-error --location \
              --retry 1 --retry-all-errors --connect-timeout 15 --max-time 45 \
              --user-agent 'peibi-market-data-source-probe/2.0' \
              --output "$output" --write-out '%{http_code}' "$url" || true)"
            printf '%s' "$status"
          }

          emit_html_pe() {
            python3 - "$1" "$2" "$3" "$4" <<'PY'
          import re, sys
          from html import unescape
          from html.parser import HTMLParser
          path, source, metric, http = sys.argv[1:]
          class Extractor(HTMLParser):
              def __init__(self): super().__init__(); self.parts=[]
              def handle_data(self, data): self.parts.append(data)
          try:
              p=Extractor(); p.feed(open(path, encoding='utf-8', errors='ignore').read())
              text=re.sub(r'\s+', ' ', unescape(' '.join(p.parts)))
              section=text[text.find('Index Characteristics as of'):]
              date=re.search(r'Index Characteristics as of\s+([A-Z][a-z]{2}\s+\d{1,2}\s+\d{4})', section)
              value=re.search(r'Price/Earnings\b.{0,900}?\b(\d+\.\d+)\b', section)
              if http == '200' and date and value:
                  print(f'{source}\t{metric}\t{http}\tN/A\t{value.group(1)}x\t{date.group(1)}\tPASS')
              else:
                  print(f'{source}\t{metric}\t{http or "000"}\tN/A\t—\t—\tPARSE_FAIL')
          except Exception:
              print(f'{source}\t{metric}\t{http or "000"}\tN/A\t—\t—\tPARSE_FAIL')
          PY
          }

          extract_pdf() {
            local source="$1" file="$2" http="$3" pattern="$4"
            local text_file="${file}.txt"
            if [ "$http" != "200" ]; then
              printf '%s\t%s\t%s\tFAIL\t—\t—\tPARSE_FAIL\n' "$source" "PDF diagnostics" "$http" >> "$results"
              return
            fi
            if ! pdftotext -layout "$file" "$text_file"; then
              printf '%s\t%s\t%s\tFAIL\t—\t—\tPARSE_FAIL\n' "$source" "PDF diagnostics" "$http" >> "$results"
              return
            fi
            printf '%s\t%s\t%s\tPASS\t—\t—\tPARSE_FAIL\n' "$source" "PDF diagnostics" "$http" >> "$results"
            echo ""
            echo "===== ${source}: keyword context ====="
            if ! grep --text --line-number --ignore-case --extended-regexp --context=3 "$pattern" "$text_file"; then
              echo "(No matching text for the requested keywords.)"
            fi
            echo "===== end ${source} ====="
          }

          qndx="$work_dir/qndx.html"; status="$(fetch 'https://www.ssga.com/us/en/individual/etfs/state-street-spdr-portfolio-nasdaq-100-etf-qndx' "$qndx")"; emit_html_pe "$qndx" 'State Street QNDX' 'PE' "$status" >> "$results"
          spy="$work_dir/spy.html"; status="$(fetch 'https://www.ssga.com/us/en/individual/etfs/state-street-spdr-sp-500-etf-trust-spy' "$spy")"; emit_html_pe "$spy" 'State Street SPY' 'PE' "$status" >> "$results"

          a500="$work_dir/a500.pdf"; status="$(fetch 'https://oss-ch.csindex.com.cn/static/html/csindex/public/uploads/indices/detail/files/zh_CN/000510factsheet.pdf' "$a500")"; extract_pdf 'CSI A500 factsheet' "$a500" "$status" 'PE|PB|市盈率|市净率|日期|截至|as of'
          dividend="$work_dir/dividend.pdf"; status="$(fetch 'https://oss-ch.csindex.com.cn/static/html/csindex/public/uploads/indices/detail/files/zh_CN/930955factsheet.pdf' "$dividend")"; extract_pdf 'CSI 红利低波100 factsheet' "$dividend" "$status" 'PE|Dividend Yield|市盈率|股息率|日期|截至|as of'
          securities="$work_dir/securities.pdf"; status="$(fetch 'https://oss-ch.csindex.com.cn/static/html/csindex/public/uploads/indices/detail/files/zh_CN/399975factsheet.pdf' "$securities")"; extract_pdf 'CSI 证券 factsheet' "$securities" "$status" 'PE|PB|市盈率|市净率|日期|截至|as of'
          hstech="$work_dir/hstech.pdf"; status="$(fetch 'https://www.hsi.com.hk/static/uploads/contents/en/dl_centre/factsheets/hsteche.pdf' "$hstech")"; extract_pdf 'Hang Seng TECH factsheet' "$hstech" "$status" 'P/E|Date|As of|截至日期'

          {
            echo '## Source probe V2'
            echo
            echo '| Source | Metric | HTTP | PDF text extraction | Value | Observation Date | Result |'
            echo '|---|---|---:|---|---:|---|---|'
            while IFS=$'\t' read -r source metric http extraction value date result; do
              echo "| ${source} | ${metric} | ${http} | ${extraction} | ${value} | ${date} | ${result} |"
            done < "$results"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          cat "$results"

      - name: Verify read-only ending state
        if: always()
        run: test -z "$(git status --porcelain)"
